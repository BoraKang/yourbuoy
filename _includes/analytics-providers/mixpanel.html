{%- if site.analytics.mixpanel.token and page.layout == 'article' -%}
	<!-- Mixpanel: 글 읽기 깊이와 TOC 클릭 -->
	<script>
		(function () {
			var ARTICLE = {
				article_title: {{ page.title | jsonify }},
				article_category: {{ page.categories[0] | jsonify }}
			};
			var MILESTONES = [25, 50, 75, 100];
			var sent = {};
			var ticking = false;

			function track(name, props) {
				var data = {}, k;
				for (k in ARTICLE) { data[k] = ARTICLE[k]; }
				for (k in props) { data[k] = props[k]; }
				window.mixpanel && window.mixpanel.track(name, data);
			}

			function once(key, name, props) {
				if (sent[key]) { return; }
				sent[key] = true;
				track(name, props);
			}

			// 스크롤 컨테이너가 window가 아닐 수도 있어 위치는 화면 기준으로 잰다.
			function check() {
				ticking = false;
				var content = document.querySelector('.article__content');
				if (!content) { return; }
				var vh = window.innerHeight || document.documentElement.clientHeight;
				var rect = content.getBoundingClientRect();
				var main = document.querySelector('.js-page-main');
				var scrolled = Math.max(window.pageYOffset || 0, main ? main.scrollTop : 0);

				if (scrolled >= vh) {
					once('viewport', 'article_scrolled', { viewport_height: vh });
				}
				if (rect.height <= 0) { return; }
				var read = Math.min(100, Math.max(0, (vh - rect.top) / rect.height * 100));
				for (var i = 0; i < MILESTONES.length; i++) {
					if (read >= MILESTONES[i]) {
						once('p' + MILESTONES[i], 'article_read_progress', { percent: MILESTONES[i] });
					}
				}
			}

			document.addEventListener('scroll', function () {
				if (!ticking) {
					ticking = true;
					window.requestAnimationFrame(check);
				}
			}, { capture: true, passive: true });

			// TOC는 JS로 그려지고 자체 click 핸들러가 기본 동작을 막으므로 문서 단에서 잡는다.
			document.addEventListener('click', function (e) {
				var link = e.target.closest && e.target.closest('.js-toc-root a');
				if (!link) { return; }
				var links = document.querySelectorAll('.js-toc-root a');
				var li = link.parentNode;
				var level = (li && li.className.match(/toc-(h\d)/) || [])[1] || null;
				track('toc_clicked', {
					heading_text: link.textContent.trim(),
					heading_id: (link.getAttribute('href') || '').replace(/^#/, ''),
					heading_level: level,
					heading_index: Array.prototype.indexOf.call(links, link) + 1,
					heading_total: links.length
				});
			}, true);

			// 체류 시간: 탭이 보이는 동안만 센다. 탭을 떠날 때마다 그 사이 시간을 보내므로
			// 글별 체류 시간은 engaged_seconds의 합으로 본다.
			var visibleSince = document.visibilityState === 'visible' ? Date.now() : null;
			var pendingMs = 0;

			function flush() {
				if (visibleSince !== null) {
					pendingMs += Date.now() - visibleSince;
					visibleSince = null;
				}
				var seconds = Math.round(pendingMs / 1000);
				if (seconds < 1) { return; }
				pendingMs = 0;
				var data = { engaged_seconds: seconds, max_read_percent: maxRead() }, k;
				for (k in ARTICLE) { data[k] = ARTICLE[k]; }
				window.mixpanel && window.mixpanel.track('article_time_spent', data, { transport: 'sendBeacon', send_immediately: true });
			}

			function maxRead() {
				for (var i = MILESTONES.length - 1; i >= 0; i--) {
					if (sent['p' + MILESTONES[i]]) { return MILESTONES[i]; }
				}
				return 0;
			}

			document.addEventListener('visibilitychange', function () {
				if (document.visibilityState === 'visible') {
					visibleSince = Date.now();
				} else {
					flush();
				}
			});
			window.addEventListener('pagehide', flush);
		})();
	</script>
{%- endif -%}
